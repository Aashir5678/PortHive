<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Port Hive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #7c3aed;
      --purple-glow: rgba(124, 58, 237, 0.18);
      --green: #22c55e;
      --red: #ef4444;
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #181818;
      --border: rgba(124, 58, 237, 0.25);
      --border-dim: rgba(255, 255, 255, 0.06);
      --text: #e4e4e7;
      --text-dim: #71717a;
      --mono: 'JetBrains Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
    }

    .shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--purple);
      text-transform: uppercase;
    }
    .logo span { color: var(--text-dim); font-weight: 400; }
    .header-meta { display: flex; gap: 28px; align-items: center; }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-dim);
      font-size: 15px;
      letter-spacing: 0.05em;
    }
    .meta-val { color: var(--text); font-weight: 500; font-size: 15px; }
    .live-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .statsbar {
      display: flex;
      gap: 1px;
      border-bottom: 1px solid var(--border-dim);
      background: var(--border-dim);
    }
    .stat {
      flex: 1;
      background: var(--surface);
      padding: 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .stat-val { font-size: 26px; font-weight: 700; }
    .stat-val.green { color: var(--green); }
    .stat-val.purple { color: var(--purple); }
    .stat-val.red { color: var(--red); }
    .stat-val.dim { color: var(--text-dim); }

    .content {
      display: flex;
      flex: 1;
      gap: 1px;
      background: var(--border-dim);
    }
    .panel {
      background: var(--bg);
      padding: 24px 28px;
    }
    .connections { flex: 1.5; min-width: 0; overflow-x: auto; }
    .alerts { flex: 1; min-width: 280px; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-dim);
    }
    .panel-title {
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--purple);
      font-weight: 700;
    }
    .badge {
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 2px;
      background: var(--purple-glow);
      color: var(--purple);
      border: 1px solid rgba(124, 58, 237, 0.3);
      letter-spacing: 0.05em;
    }
    .badge.red {
      background: rgba(239, 68, 68, 0.1);
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.3);
    }

    table { width: 100%; border-collapse: collapse; min-width: 520px; }
    thead th {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 12px 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-dim);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border-dim);
      transition: background 0.15s;
    }
    tbody tr:hover { background: var(--surface2); }
    tbody tr.scanning { background: rgba(239, 68, 68, 0.04); }
    tbody tr.scanning:hover { background: rgba(239, 68, 68, 0.08); }
    tbody tr.inactive { opacity: 0.45; }
    td { padding: 11px 12px; vertical-align: middle; white-space: nowrap; }
    .ip { color: var(--text); font-weight: 500; }
    .port-cell { color: var(--purple); }
    .duration { color: var(--text-dim); }

    .status-wrap { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .s-active { background: var(--green); }
    .s-inactive { background: var(--text-dim); }
    .s-scanning { background: var(--red); }
    .status-label { font-size: 11px; }
    .sl-active { color: var(--green); }
    .sl-inactive { color: var(--text-dim); }
    .sl-scanning { color: var(--red); }

    .actions { display: flex; gap: 6px; }
    .btn {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.07em;
      padding: 4px 10px;
      border-radius: 2px;
      cursor: pointer;
      background: transparent;
      text-transform: uppercase;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-disconnect { border: 1px solid rgba(239, 68, 68, 0.35); color: var(--red); }
    .btn-disconnect:hover:not(:disabled) { background: rgba(239, 68, 68, 0.1); border-color: var(--red); }
    .btn-block { border: 1px solid rgba(124, 58, 237, 0.35); color: var(--purple); }
    .btn-block:hover:not(:disabled) { background: var(--purple-glow); border-color: var(--purple); }
    .btn-unblock { border: 1px solid rgba(34, 197, 94, 0.35); color: var(--green); }
    .btn-unblock:hover:not(:disabled) { background: rgba(34, 197, 94, 0.08); border-color: var(--green); }
    .btn-inspect { border: 1px solid rgba(255,255,255,0.12); color: var(--text-dim); }
    .btn-inspect:hover:not(:disabled) { background: var(--surface2); border-color: rgba(255,255,255,0.2); color: var(--text); }

    .feed { display: flex; flex-direction: column; gap: 8px; }
    .feed-empty { color: var(--text-dim); font-size: 11px; padding: 12px 0; }
    .feed-item {
      padding: 12px 14px;
      border: 1px solid var(--border-dim);
      border-radius: 2px;
      border-left: 2px solid var(--red);
      background: var(--surface);
    }
    .feed-item.med { border-left-color: var(--purple); }
    .feed-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .feed-ip { color: var(--text); font-weight: 500; font-size: 12px; }
    .feed-time { color: var(--text-dim); font-size: 10px; margin-top: 5px; }
    .feed-detail { color: var(--text-dim); font-size: 11px; line-height: 1.6; }
    .feed-detail span { color: var(--purple); }
    .severity {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 2px;
    }
    .sev-high { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .sev-med { background: var(--purple-glow); color: var(--purple); border: 1px solid rgba(124,58,237,0.3); }

    .payload-line {
      font-size: 12px;
      color: var(--green);
      padding: 5px 0;
      border-bottom: 1px solid var(--border-dim);
      word-break: break-all;
      line-height: 1.6;
    }
    .payload-line:last-child { border-bottom: none; }
    .payload-index { color: var(--text-dim); margin-right: 10px; user-select: none; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border-dim);
      border-left: 2px solid var(--green);
      padding: 10px 16px;
      font-size: 11px;
      color: var(--text);
      border-radius: 2px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { border-left-color: var(--red); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="logo">Port<span>/</span>Hive</div>
      <div class="header-meta">
        <div class="meta-item"><div class="live-dot"></div><span class="meta-val" id="live-label">Live</span></div>
        <div class="meta-item">Honeypot Latency <span class="meta-val" id="latency">-- ms</span></div>
      </div>
    </div>

    <div class="statsbar">
      <div class="stat"><div class="stat-label">Active</div><div class="stat-val green" id="stat-active">0</div></div>
      <div class="stat"><div class="stat-label">Inactive</div><div class="stat-val dim" id="stat-inactive">0</div></div>
      <div class="stat"><div class="stat-label">Scan Attempts</div><div class="stat-val red" id="stat-scans">0</div></div>
      <div class="stat"><div class="stat-label">Blocked IPs</div><div class="stat-val purple" id="stat-blocked">0</div></div>
    </div>

    <div class="content">
      <div class="panel connections">
        <div class="panel-header">
          <div class="panel-title">Connections</div>
          <div class="badge" id="conn-badge">0 total</div>
        </div>
        <table>
          <thead>
            <tr>
              <th>IP Address</th>
              <th>Port</th>
              <th>Connected For</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="connections-body">
            <tr><td colspan="5" style="color: var(--text-dim); padding: 20px 12px;">No connections.</td></tr>
          </tbody>
        </table>
      </div>

      <div class="panel alerts">
        <div class="panel-header">
          <div class="panel-title">Scan Alerts</div>
          <div class="badge red" id="alert-badge">0 detected</div>
        </div>
        <div class="feed" id="alerts-feed">
          <div class="feed-empty">No alerts detected.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const BASE_URL = 'http://localhost:5000';
    const POLL_INTERVAL = 2500;

    let blockedIPs = new Set();
    let scanAlerts = [];
    let currentClients = [];

    function fmt(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      if (h > 0) return h + 'h ' + String(m % 60).padStart(2, '0') + 'm ' + String(s % 60).padStart(2, '0') + 's';
      if (m > 0) return m + 'm ' + String(s % 60).padStart(2, '0') + 's';
      return s + 's';
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { t.className = 'toast'; }, 2500);
    }

    async function postAction(endpoint, body) {
      const res = await fetch(BASE_URL + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return res.ok;
    }

    async function disconnect(ipv4, port) {
      const ok = await postAction('/disconnect', { ipv4, port });
      showToast(ok ? `Disconnected ${ipv4}` : `Failed to disconnect ${ipv4}`, !ok);
    }

    async function blockIP(ipv4) {
      const ok = await postAction('/block', { ipv4 });
      if (ok) blockedIPs.add(ipv4);
      showToast(ok ? `Blocked ${ipv4}` : `Failed to block ${ipv4}`, !ok);
    }

    async function unblockIP(ipv4) {
      const ok = await postAction('/unblock', { ipv4 });
      if (ok) blockedIPs.delete(ipv4);
      showToast(ok ? `Unblocked ${ipv4}` : `Failed to unblock ${ipv4}`, !ok);
    }

    function escapeHTML(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,' ').replace(/\r/g,'');
    }

    function toggleInspect(ipv4, port) {
      const rowId = 'inspect-' + ipv4.replace(/\./g, '-') + '-' + port;
      const existing = document.getElementById(rowId);
      if (existing) { existing.remove(); return; }
      const client = currentClients.find(c => c.ipv4 === ipv4 && c.port === port);
      const content = (!client || !client.messages || client.messages.length === 0)
        ? '<span style="color:var(--text-dim);font-size:11px;">No messages received.</span>'
        : client.messages.map((msg, i) =>
            `<div class="payload-line"><span class="payload-index">${String(i + 1).padStart(2, '0')}</span>${escapeHTML(msg)}</div>`
          ).join('');
      const tr = document.createElement('tr');
      tr.id = rowId;
      tr.innerHTML = `<td colspan="5" style="padding:0;background:var(--surface);border-bottom:1px solid var(--border-dim);">
        <div style="padding:12px 18px;border-left:2px solid var(--purple);">${content}</div>
      </td>`;
      const rows = document.querySelectorAll('#connections-body tr');
      for (const row of rows) {
        if (row.querySelector(`[onclick*="${ipv4}"]`)) { row.after(tr); break; }
      }
    }

    function renderConnections(clients) {
      currentClients = clients;
            const tbody = document.getElementById('connections-body');
            const now = Date.now();

            const openInspects = new Set(
              [...document.querySelectorAll('[id^="inspect-"]')].map(r => r.id)
            );

            if (clients.length === 0) {
              tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-dim); padding: 20px 12px;">No connections.</td></tr>';
              return;
            }

            tbody.innerHTML = clients.map(c => {
        const elapsed = now - c.time_connected_at;
        const isBlocked = blockedIPs.has(c.ipv4);
        const status = !c.status ? 'inactive' : c.status === 'scanning' ? 'scanning' : 'active';

        const dotClass = status === 'active' ? 's-active' : status === 'scanning' ? 's-scanning' : 's-inactive';
        const labelClass = status === 'active' ? 'sl-active' : status === 'scanning' ? 'sl-scanning' : 'sl-inactive';
        const labelText = status.charAt(0).toUpperCase() + status.slice(1);
        const rowClass = status === 'scanning' ? 'scanning' : status === 'inactive' ? 'inactive' : '';

        const actions = isBlocked
          ? `<button class="btn btn-unblock" onclick="unblockIP('${c.ipv4}')">Unblock</button>
             <button class="btn btn-inspect" onclick="toggleInspect('${c.ipv4}', ${c.port})">Inspect</button>`
          : `<button class="btn btn-disconnect" onclick="disconnect('${c.ipv4}', ${c.port})">Disconnect</button>
             <button class="btn btn-block" onclick="blockIP('${c.ipv4}')">Block</button>
             <button class="btn btn-inspect" onclick="toggleInspect('${c.ipv4}', ${c.port})">Inspect</button>`;

        return `<tr class="${rowClass}">
          <td class="ip">${c.ipv4}</td>
          <td class="port-cell">${c.port}</td>
          <td class="duration">${fmt(elapsed)}</td>
          <td><div class="status-wrap"><div class="status-dot ${dotClass}"></div><span class="status-label ${labelClass}">${labelText}</span></div></td>
          <td><div class="actions">${actions}</div></td>
        </tr>`;
      }).join('');

      openInspects.forEach(rowId => {
        const match = rowId.match(/^inspect-(.+)-(\d+)$/);
        if (!match) return;
        const ipv4 = match[1].replace(/-/g, '.');
        const port = parseInt(match[2]);
        toggleInspect(ipv4, port);
      });

    }

    function updateStats(clients) {
      const active = clients.filter(c => c.status === true).length;
      const inactive = clients.filter(c => c.status === false).length;

      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-inactive').textContent = inactive;
      document.getElementById('stat-scans').textContent = scanAlerts.length;
      document.getElementById('stat-blocked').textContent = blockedIPs.size;
      document.getElementById('conn-badge').textContent = clients.length + ' total';
    }

    function renderAlerts() {
      const feed = document.getElementById('alerts-feed');
      document.getElementById('alert-badge').textContent = scanAlerts.length + ' detected';
      if (scanAlerts.length === 0) {
        feed.innerHTML = '<div class="feed-empty">No alerts detected.</div>';
        return;
      }
      feed.innerHTML = scanAlerts.map(a => `
        <div class="feed-item ${a.severity === 'high' ? '' : 'med'}">
          <div class="feed-top">
            <span class="feed-ip">${a.ipv4}</span>
            <span class="severity ${a.severity === 'high' ? 'sev-high' : 'sev-med'}">${a.severity}</span>
          </div>
          <div class="feed-detail">Port <span>${a.port}</span> &mdash; ${a.detail}</div>
          <div class="feed-time">${a.time}</div>
        </div>
      `).join('');
    }

    async function poll() {
      try {
        const res = await fetch(BASE_URL + '/clients');
        if (!res.ok) return;
        const clients = await res.json();
        renderConnections(clients);
        updateStats(clients);
      } catch (e) {}
    }

    async function pollLatency() {
      try {
        const res = await fetch(BASE_URL + '/latency');
        const data = await res.json();
        const alive = data.latency !== -1;
        document.getElementById('latency').textContent = alive ? data.latency + ' ms' : '-- ms';
        document.querySelector('.live-dot').style.background = alive ? 'var(--green)' : 'var(--red)';
        document.getElementById('live-label').textContent = alive ? 'Live' : 'Offline';
      } catch (e) {
        document.querySelector('.live-dot').style.background = 'var(--red)';
        document.getElementById('live-label').textContent = 'Offline';
      }
    }

    setInterval(() => {
      document.querySelectorAll('[id^="inspect-"]').forEach(row => {
        const match = row.id.match(/^inspect-(.+)-(\d+)$/);
        if (!match) return;
        const ipv4 = match[1].replace(/-/g, '.');
        const port = parseInt(match[2]);
        const client = currentClients.find(c => c.ipv4 === ipv4 && c.port === port);
        if (!client) return;
        const content = (!client.messages || client.messages.length === 0)
          ? '<span style="color:var(--text-dim);font-size:11px;">No messages received.</span>'
          : client.messages.map((msg, i) =>
              `<div class="payload-line"><span class="payload-index">${String(i + 1).padStart(2, '0')}</span>${escapeHTML(msg)}</div>`
            ).join('');
        row.querySelector('div').innerHTML = content;
      });
    }, 5000);

    poll();
    setInterval(poll, POLL_INTERVAL);
    pollLatency();
    setInterval(pollLatency, POLL_INTERVAL);
    renderAlerts();
  </script>
</body>
</html>
